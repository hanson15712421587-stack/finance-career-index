name: update-live-data
on:
  schedule:
    - cron: "0 * * * *"   # 每小时整点更新
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install deps
        run: pip install --quiet akshare pandas
      - name: Fetch live data
        run: python update_data.py
      - name: Commit & push
        run: |
          git config user.name "data-bot"
          git config user.email "data-bot@users.noreply.github.com"
          git add data/live.json
          git diff --cached --quiet || git commit -m "chore: refresh live data $(date -u +%FT%TZ)"
          git push
