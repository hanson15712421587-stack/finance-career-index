name: update-live-data
on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:
  pull_request:
    paths:
      - "**.py"
      - "requirements.txt"
      - ".github/workflows/update.yml"
  push:
    branches: [main]
    paths:
      - "**.py"
      - "requirements.txt"
      - ".github/workflows/update.yml"
permissions:
  contents: read
concurrency:
  group: live-data-${{ github.ref }}
  cancel-in-progress: false
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m unittest discover -s tests -v
  update:
    needs: test
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies and record resolved versions
        run: |
          python -m pip install -r requirements.txt
          python -m pip freeze > dependency-versions.txt
      - name: Fetch candidate
        run: python update_data.py --output data/live.candidate.json
      - name: Validate and atomically publish
        shell: bash
        run: |
          set -o pipefail
          python quality_gate.py data/live.candidate.json --publish data/live.json | tee quality.jsonl
      - name: Preserve audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: data-quality-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            quality.jsonl
            dependency-versions.txt
            data/live.candidate.json
          if-no-files-found: warn
          retention-days: 30
      - name: Commit and push validated snapshot
        run: |
          git config user.name "data-bot"
          git config user.email "data-bot@users.noreply.github.com"
          git add data/live.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: refresh validated live data"
            git push
          fi
